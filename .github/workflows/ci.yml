name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ master ]

jobs:
  check:
    name: Code check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: pip install flake8

      - name: Syntax check
        run: python -m compileall -q .

      - name: Flake8 (serious errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --exclude=venv

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ecommerce-website:${{ github.sha }} .

      - name: Run container and check the website
        run: |
          docker run -d --name site -p 5000:5000 -e DATABASE_URL=sqlite:///:memory: -e SECRET_KEY=ci-test-key ecommerce-website:${{ github.sha }}
          sleep 8
          curl -fs http://localhost:5000/ > /dev/null
          curl -fs http://localhost:5000/login > /dev/null

      - name: Show container logs
        if: always()
        run: docker logs site || true
